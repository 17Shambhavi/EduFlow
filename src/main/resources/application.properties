## Server (Render gives the PORT automatically)
server.port=${PORT:8080}

## MySQL Database (values come from environment variables)
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&requireSSL=true&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

## JPA / Hibernate (creates the tables on first start)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

## JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

## File Upload
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

## Cloudinary (placeholders so the app still starts if not set)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:placeholder}
cloudinary.api-key=${CLOUDINARY_API_KEY:placeholder}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:placeholder}

## CORS (comma separated list of allowed frontend URLs)
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
